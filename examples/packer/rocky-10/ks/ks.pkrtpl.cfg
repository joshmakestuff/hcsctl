# Example kickstart for Rocky Linux 10 under Packer. Scaffolding only: this exists so the
# example validates and can install. Replace it with your own base-image process.
#
# Rendered by templatefile() from rocky-10.pkr.hcl; ${root_password} is substituted.
# Anaconda finds this file by the CD volume label OEMDRV.

text
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

network --bootproto=dhcp --device=link --activate --hostname=hcs-guest
rootpw --plaintext ${root_password}
firewall --disabled
services --enabled=sshd,chronyd
bootloader --append="console=ttyS0,115200n8 console=tty0"

clearpart --all --initlabel
autopart --type=lvm --nohome

%packages --ignoremissing
@^minimal-environment
openssh-server
hyperv-daemons
%end

reboot --eject

%post --log=/root/ks-post.log
# Packer connects as root over SSH; Rocky 10 forbids that by default. Build fixture only.
echo 'PermitRootLogin yes' > /etc/ssh/sshd_config.d/01-example-rootlogin.conf
%end

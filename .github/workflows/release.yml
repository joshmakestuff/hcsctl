# Builds the artifact a consumer acquires. Tag-driven: pushing v* is the whole release
# ceremony, and nothing else publishes.
#
# This does NOT prove the release works. Hosted runners have no Hyper-V, so the same caveat as
# contract.yml applies -- a green tick here means "built, stamped and published". What "works"
# means is the elevated smoke transcript on a real host (#38).
name: release

on:
  push:
    tags: ['v*']
  # Manual runs build and check the artifact without publishing, which is how to test a change
  # to this file without burning a version number.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build, stamp and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The same gates contract.yml applies. A tag that cannot pass them should not become a
      # release: the artifact is what a consumer pins, and an unpinnable-because-broken version
      # is worse than a missing one.
      - run: go vet ./...
      - run: go test ./...

      # CGO_ENABLED=0 keeps it a single file with no runtime dependency, which is the whole
      # premise of "a consumer drops one exe somewhere and runs it".
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,12))" }
          $commit = $env:GITHUB_SHA.Substring(0,12)
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          go build -ldflags "-X github.com/joshmakestuff/hcsctl/internal/cli.ToolVersion=$version" -o hcsctl.exe .
        id: build

      # The stamp is checked, not assumed. A wrong -X path is silently ignored by the Go linker:
      # the build succeeds, the binary reports "dev", and the release looks fine until someone
      # tries to identify which build they have -- which is the one thing #29 exists for.
      - name: Verify the version stamp took
        run: |
          $reported = (./hcsctl.exe version --json | ConvertFrom-Json).toolVersion
          if ($reported -ne '${{ steps.build.outputs.version }}') {
            throw "hcsctl reports '$reported' but this build is '${{ steps.build.outputs.version }}' -- the -ldflags -X path is wrong."
          }
          Write-Host "hcsctl reports $reported"

      # The guest agent ships from the same tag as hcsctl: host and guest share
      # internal/guestproto and a protocol mismatch is a hard failure. -trimpath and
      # -buildvcs=false keep VCS info out of the binary; the -X stamps are the identity.
      - name: Build hcsguest (both guest platforms)
        env:
          CGO_ENABLED: '0'
        run: |
          $version = '${{ steps.build.outputs.version }}'
          $commit = '${{ steps.build.outputs.commit }}'
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags "-X main.Version=$version -X main.Commit=$commit" -o hcsguest-windows-amd64.exe ./cmd/hcsguest
          $env:GOOS = 'linux'; $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags "-X main.Version=$version -X main.Commit=$commit" -o hcsguest-linux-amd64 ./cmd/hcsguest

      # Same assertion as hcsctl: the stamp is checked, not assumed. The Linux binary cannot run
      # on this runner, but it is built with the identical -ldflags string, so the Windows check
      # covers both.
      - name: Verify the guest stamp took
        run: |
          $reported = (./hcsguest-windows-amd64.exe version)
          if ($reported -notmatch [regex]::Escape('${{ steps.build.outputs.version }}')) {
            throw "hcsguest reports '$reported' but this build is '${{ steps.build.outputs.version }}' -- the -ldflags -X path is wrong."
          }
          if ($reported -notmatch [regex]::Escape('${{ steps.build.outputs.commit }}')) {
            throw "hcsguest reports '$reported' but this build is '${{ steps.build.outputs.commit }}' -- the commit stamp is wrong."
          }
          Write-Host $reported

      - name: Package
        run: |
          Compress-Archive -Path hcsctl.exe -DestinationPath hcsctl-windows-amd64.zip
          # One checksum file covering every asset. The format matches what Get-FileHash prints,
          # because Windows consumers compare against Get-FileHash output, and
          # `sha256sum -c` accepts the same <hash><two-spaces><name> shape the Linux
          # installer feeds it.
          'hcsctl-windows-amd64.zip', 'hcsguest-windows-amd64.exe', 'hcsguest-linux-amd64' |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash)  $_" } |
            Out-File -FilePath SHA256SUMS -Encoding ascii
          Get-Content SHA256SUMS

      - name: Publish
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hcsctl-windows-amd64.zip
            hcsguest-windows-amd64.exe
            hcsguest-linux-amd64
            SHA256SUMS
          # Everything before 1.0 is a preview by definition; saying so in the release keeps a
          # consumer from reading a version number as a stability promise.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true

      # A dispatch run produces no release, so the artifact is attached to the run instead --
      # otherwise there is no way to check a change to this file without tagging.
      - name: Attach the artifact to the run instead
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hcsctl-windows-amd64
          path: |
            hcsctl-windows-amd64.zip
            hcsguest-windows-amd64.exe
            hcsguest-linux-amd64
            SHA256SUMS

# A green tick here means "builds, starts, and honours its contract" -- never "works".
# Hosted runners have no Hyper-V and no usable elevation, so nothing in this workflow
# reaches HCS. "Works" is the elevated smoke transcript on a real host.
name: contract
# PRs only: direct pushes to main are gated by running the suite locally before pushing.
# workflow_dispatch is the manual fallback.
on:
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    name: builds, starts, honours the contract (never "works")
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o hcsctl.exe .
      - run: go test -v .

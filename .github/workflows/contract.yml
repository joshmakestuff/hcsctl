# A green tick here means "builds, starts, and honours its contract" -- never "works".
# Hosted runners have no Hyper-V and no elevation worth having, so nothing in this workflow
# reaches HCS; pull would also cost ~114 MB of registry traffic per run. "Works" is the
# elevated smoke transcript on a real host (issue #38), and issue #1 records
# which verbs have actually run.
name: contract
# PRs only, by decision 2026-08-06: direct pushes to main are gated by running the suite
# locally before pushing; the machine gate earns its keep where a change is up for review.
# workflow_dispatch is the manual fallback -- also useful because GitHub can drop an event
# (de92f97 was pushed with this workflow active and no run was created).
on:
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    name: builds, starts, honours the contract (never "works")
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o hcsctl.exe .
      - run: go test -v .
